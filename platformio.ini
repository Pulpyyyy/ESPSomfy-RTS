[platformio]
default_envs = esp32dev


[env]
platform = espressif32@6.8.1
framework = arduino
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8.0
    lsatan/SmartRC-CC1101-Driver-Lib @ 2.5.7
    esp32async/ESPAsyncWebServer @ 3.6.0
    esp32async/AsyncTCP @ 3.3.2
    links2004/WebSockets @ 2.4.1

extra_scripts = 
    pre:minify_data.py
board_build.filesystem = littlefs
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; Nothing in the project or its libraries ever catches: without handlers a
    ; throw already aborts, and the unwind tables alone cost 86KB of flash
    ; (measured: .eh_frame + .gcc_except_table + unwind code).
    -fno-exceptions
    ; Pin the async HTTP task next to the WiFi stack on core 0: core 1 stays
    ; dedicated to loop() and the RTS radio timing. Default (-1) would let the
    ; priority-10 task preempt the loop on core 1 during HTTP bursts.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; The blocking long-ops (getReleases/downloadFirmware do a GitHub TLS
    ; handshake, scanaps a WiFi scan) run inline in the async_tcp task; the
    ; default 8KB stack overflows during the mbedtls chain verification, so
    ; give the task room for the TLS session.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; A browser cold-load runs ~6 parallel transfers, each producing recv/ack/
    ; poll events; the default 64-slot event queue can overflow under that
    ; burst (dropped events stall a transfer until the next poll tick).
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=128


[env:esp32dev]
board = esp32dev
board_build.partitions = partitions_4mb.csv


[env:esp32wrover]
board = esp-wrover-kit
board_build.partitions = partitions_4mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = partitions_4mb.csv

[env:esp32s2]
board = esp32-s2-saola-1
board_build.partitions = partitions_4mb.csv

[env:esp32s3_base]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_4mb]
extends = env:esp32s3_base
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_qspi

[env:esp32s3_8mb]
extends = env:esp32s3_base
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb.csv

# Host unit tests: `pio test -e native`.
# Not part of default_envs, so `pio run` never builds it.
# Everything inherited from [env] that only makes sense for the ESP32 is reset
# to empty here - in particular the Arduino framework, the ESP32 libraries and
# the data-dev minifier, none of which must run for a host build.
[env:native]
platform = native
framework =
lib_deps =
extra_scripts =
build_flags = -std=gnu++17 -Wall -Wextra -I src
# Only the Arduino-free modules are compiled for the host; everything else in
# src/ pulls in WiFi, LittleFS or the CC1101 driver.
test_build_src = yes
build_src_filter =
    -<*>
    +<JsonFormatter.cpp>
    +<VersionParse.cpp>
    +<SomfyCodec.cpp>
