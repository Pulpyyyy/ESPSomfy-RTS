name: ESPSomfy-RTS Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  # Rebuild the assets of an already-published release with the current
  # workflow. The source is checked out at the tag; only the build recipe
  # (offsets, pinned tools) comes from main.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag whose assets should be rebuilt (e.g. v3.1.0)"
        required: true
        type: string

jobs:
  # =======================================================================
  # JOB 0 : Tests unitaires natifs (aucune carte requise)
  # Couvre les modules sans dépendance Arduino : formateur JSON, lecture de
  # version OTA, codec de trame Somfy.
  # =======================================================================
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run unit tests
        run: pio test -e native

  # =======================================================================
  # JOB 1 : Génération du LittleFS unique (Compiles pour Dev ET Release)
  # =======================================================================
  littlefs:
    permissions:
      contents: write
    name: LittleFS Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      # Sur une release, la version de l'UI est prise du tag (ex: v2.6.0)
      # pour rester synchrone avec le firmware et l'OTA GitHub.
      - name: Inject release version into UI
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          echo "${TAG#v}" > data-dev/appversion
          # sed exits 0 when its pattern matches nothing, so a renamed variable or a
          # reformatted line would silently ship a release advertising the previous
          # version. Every substitution below is therefore verified.
          sed -i "s/appVersion = 'v[0-9][^']*'/appVersion = '${TAG}'/" data-dev/index.js
          if ! grep -qF "appVersion = '${TAG}'" data-dev/index.js; then
            echo "::error file=data-dev/index.js::appVersion injection failed - the 'appVersion = ...' pattern no longer matches"
            exit 1
          fi
          # Cache-buster on the CSS/JS refs must track the release so browsers reload
          # the new UI instead of serving a stale index.js/css from cache.
          sed -i "s/?v=[0-9][^\"']*/?v=${TAG#v}/g" data-dev/index.html
          if ! grep -qF "index.js?v=${TAG#v}" data-dev/index.html; then
            echo "::error file=data-dev/index.html::cache-buster injection failed - the '?v=' pattern no longer matches"
            exit 1
          fi
          # Any leftover cache-buster on another version means the sed only covered
          # part of the references.
          if grep -oE '\?v=[^"'"'"']*' data-dev/index.html | grep -vqF "?v=${TAG#v}"; then
            echo "::error file=data-dev/index.html::stale cache-buster left in index.html"
            grep -oE '\?v=[^"'"'"']*' data-dev/index.html | sort -u
            exit 1
          fi
          grep -n "appVersion = " data-dev/index.js | head -1
          grep -o "index.js?v=[^\"']*" data-dev/index.html | head -1
          cat data-dev/appversion

      - name: Build LittleFS image (générique via esp32dev)
        run: pio run -e esp32dev -t buildfs

      - name: Rename LittleFS to Standard Name
        run: cp .pio/build/esp32dev/littlefs.bin SomfyController.littlefs.bin

      # Sauvegarde temporaire du LittleFS pour le job suivant (firmwares)
      - name: Upload LittleFS Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LittleFS
          path: SomfyController.littlefs.bin
          retention-days: 5

      # Upload du LittleFS UNIQUE sur la page de la Release
      - name: Upload LittleFS to Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" SomfyController.littlefs.bin --clobber --repo "$GITHUB_REPOSITORY"

  # =======================================================================
  # JOB 2 : Compilation de chaque carte, Onboard fusionné et Uploads
  # =======================================================================
  arduino:
    permissions:
      contents: write
    name: ${{ matrix.name }}
    needs: [littlefs]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev
            name: ESP32
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: SomfyController.ino.esp32.bin
            obname: SomfyController.onboard.esp32.bin
          - env: esp32wrover
            name: ESP32-Wrover
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: SomfyController.ino.esp32wrover.bin
            obname: SomfyController.onboard.esp32wrover.bin
          - env: esp32c3
            name: ESP32C3
            chip: ESP32-C3
            addr_bootloader: "0x0"
            addr_littlefs: "0x370000"
            fwname: SomfyController.ino.esp32c3.bin
            obname: SomfyController.onboard.esp32c3.bin
          - env: esp32s2
            name: ESP32S2
            chip: ESP32-S2
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: SomfyController.ino.esp32s2.bin
            obname: SomfyController.onboard.esp32s2.bin

          # VERSION ESP32-S3 (4MB - Universelle)
          - env: esp32s3_4mb
            name: ESP32S3_4MB
            chip: ESP32-S3
            addr_bootloader: "0x0"
            addr_littlefs: "0x370000"
            fwname: SomfyController.ino.esp32s3_4mb.bin
            obname: SomfyController.onboard.esp32s3_4mb.bin

          # VERSION ESP32-S3 (8MB - Spécifique)
          - env: esp32s3_8mb
            name: ESP32S3_8MB
            chip: ESP32-S3
            addr_bootloader: "0x0"
            addr_littlefs: "0x770000"
            fwname: SomfyController.ino.esp32s3_8mb.bin
            obname: SomfyController.onboard.esp32s3_8mb.bin

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      # Récupération du LittleFS généré au Job 1
      - name: Get LittleFS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LittleFS

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio==6.1.19 esptool==5.3.1

      # Sur une release, FW_VERSION est pris du tag pour que le firmware
      # publié s'identifie correctement (comparaison de versions de l'OTA).
      - name: Inject release version into firmware
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          # A silent no-op here would publish a firmware still announcing the
          # previous FW_VERSION, which breaks the OTA version comparison.
          sed -i "s/#define FW_VERSION \"[^\"]*\"/#define FW_VERSION \"${TAG}\"/" src/ConfigSettings.h
          if ! grep -qF "#define FW_VERSION \"${TAG}\"" src/ConfigSettings.h; then
            echo "::error file=src/ConfigSettings.h::FW_VERSION injection failed - the '#define FW_VERSION' pattern no longer matches"
            exit 1
          fi
          grep -n "FW_VERSION" src/ConfigSettings.h | head -1

      # The onboard image is assembled by hand, so the LittleFS offset above duplicates
      # the partition table. Fail loudly when the two drift apart: a wrong offset flashes
      # the filesystem across the app partition and the device boots with no UI at all.
      - name: Check LittleFS offset against the partition table
        run: |
          CSV=$(sed -n "/^\[env:${{ matrix.env }}\]/,/^\[env:/p" platformio.ini \
                | grep -m1 'board_build.partitions' | cut -d= -f2 | tr -d ' \r')
          EXPECTED=$(grep -E '^spiffs' "$CSV" | awk -F, '{gsub(/ /,"",$4); print $4}')
          echo "env=${{ matrix.env }} table=$CSV expected=$EXPECTED declared=${{ matrix.addr_littlefs }}"
          if [ "$EXPECTED" != "${{ matrix.addr_littlefs }}" ]; then
            echo "::error::LittleFS offset ${{ matrix.addr_littlefs }} does not match $CSV ($EXPECTED)"
            exit 1
          fi

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Création de l'image de fusion onboard
      - name: ${{ matrix.name }} Image
        run: |
          python -m esptool --chip ${{ matrix.chip }} \
            merge-bin -o .pio/build/${{ matrix.env }}/SomfyController.onboard.bin \
            ${{ matrix.addr_bootloader }} .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin \
            ${{ matrix.addr_littlefs }} SomfyController.littlefs.bin

      # Compression de l'image onboard avec son nom d'archive propre
      - name: Compress onboard image
        run: zip -j .pio/build/${{ matrix.env }}/${{ matrix.obname }}.zip .pio/build/${{ matrix.env }}/SomfyController.onboard.bin

      # CAS 1 : Si c'est un PUSH de dev
      - name: Upload ${{ matrix.name }} (Dev Artifact)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/SomfyController.onboard.bin
          retention-days: 5

      # CAS 2 : Si c'est une RELEASE (Firmware applicatif + image zip d'usine).
      # gh upload names the asset after the file, so the firmware is copied
      # to its per-board asset name first.
      - name: Upload firmware and onboard image to Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          cp .pio/build/${{ matrix.env }}/firmware.bin "${{ matrix.fwname }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.fwname }}" \
            ".pio/build/${{ matrix.env }}/${{ matrix.obname }}.zip" \
            --clobber --repo "$GITHUB_REPOSITORY"
